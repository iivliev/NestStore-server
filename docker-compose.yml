services:
  postgres:
    image: postgres:17
    restart: always
    container_name: nestjs_blog_postgres_container
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - nestjs_blog_postgres_data:/var/lib/postgresql/data

volumes:
  nestjs_blog_postgres_data:
